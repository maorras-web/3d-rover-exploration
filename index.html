<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק תותח חדש</title>
    <style>
        /* איפוס שוליים כדי שהמשחק תופס את כל המסך בלי פס גלילה */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
        }
        canvas {
            display: block;
        }
    </style>

    <!-- טעינת ספריית Three.js ישירות מהרשת באמצעות Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <!-- הפעלת קובץ ה-JavaScript הראשי -->
    <script type="module" src="main.js"></script>

</body>
</html>
