<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Rover Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="desktop-warning">
  <div class="warning-icon">📱</div>
  <div class="warning-title">Mobile Devices Only</div>
  <div class="warning-text">This game is designed for mobile phones only</div>
</div>

<div id="orientation-warning">
  <div class="warning-icon">📱</div>
  <div class="warning-text">Please rotate your device to landscape</div>
  <div class="warning-sub">Rotate to landscape mode</div>
</div>

<div id="sun-glow"></div>

<div id="ui-container">
  <div id="hud-chips">
    <div id="current-biome">🌿 Green Field</div>
    <div id="time-display">🌞 12:00</div>
  </div>
  <div id="hud-map">
    <div id="minimap">
      <canvas id="minimap-canvas" width="140" height="140"></canvas>
      <div id="minimap-rover"></div>
    </div>
    <button id="btn-fullscreen">⛶ Fullscreen</button>
  </div>
</div>

<!-- Steering: LEFT button on the left, RIGHT button on the right -->
<div id="steer-left">
  <button class="ctrl-round steer-btn" data-key="left">◀<span class="ctrl-label">LEFT</span></button>
  <button class="ctrl-round steer-btn" data-key="right">▶<span class="ctrl-label">RIGHT</span></button>
</div>

<!-- Pedals: GAS and REVERSE on the right side -->
<div id="pedals-right">
  <button class="ctrl-round pedal-gas" data-key="forward">▲<span class="ctrl-label">GAS</span></button>
  <button class="ctrl-round pedal-reverse" data-key="backward">▼<span class="ctrl-label">REVERSE</span></button>
</div>

<!-- Camera controls: view toggle, closer, farther -->
<div id="cam-controls">
  <button class="cam-btn" id="cam-view">🎥</button>
  <button class="cam-btn" id="cam-in">+</button>
  <button class="cam-btn" id="cam-out">−</button>
  <button class="cam-btn" id="btn-sound">🔊</button>
</div>

<!-- Status bars (visual): health + energy -->
<div id="status-bars">
  <div class="bar-row">
    <svg viewBox="0 0 24 24" style="color:#6ff2b0"><path fill="currentColor" d="M12 21s-7-4.5-9.5-9C1 8.5 3 5 6.5 5c2 0 3.5 1 5.5 3 2-2 3.5-3 5.5-3C21 5 23 8.5 21.5 12 19 16.5 12 21 12 21z"/></svg>
    <div class="bar"><div class="bar-fill hp" id="bar-health"></div></div>
  </div>
  <div class="bar-row">
    <svg viewBox="0 0 24 24" style="color:#6fb4ff"><path fill="currentColor" d="M12 2s7 7.5 7 12a7 7 0 0 1-14 0c0-4.5 7-12 7-12z"/></svg>
    <div class="bar"><div class="bar-fill en" id="bar-energy"></div></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="main.js?v=10"></script>
</body>
</html>
