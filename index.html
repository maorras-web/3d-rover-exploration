<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>רובר מגלה</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="desktop-warning">
  <div class="warning-icon">📱</div>
  <div class="warning-title">המשחק מיועד לפלאפונים בלבד</div>
  <div class="warning-text">This game is designed for mobile devices only</div>
</div>

<div id="orientation-warning">
  <div class="warning-icon">📱</div>
  <div class="warning-text">אנא סובב את המכשיר למצב רוחב</div>
  <div class="warning-sub">Rotate to landscape</div>
</div>

<div id="ui-container">
  <div id="top-left-hud">
    <div id="minimap">
      <canvas id="minimap-canvas" width="140" height="140"></canvas>
      <div id="minimap-rover"></div>
    </div>
    <div id="discovered-count">🔍 <span id="disc-num">0</span>/<span id="disc-total">0</span></div>
  </div>
  <div id="top-right-hud">
    <div id="current-biome">🌿 שטח ירוק</div>
    <div id="time-display">🌞 12:00</div>
    <div id="quest-box">
      <div class="quest-title">📋 משימה</div>
      <div id="quest-text">חקור את העולם וגלה מקומות חדשים</div>
    </div>
  </div>
  <div id="bottom-right-hud">
    <div id="stats">
      <div class="stat-bar"><span>❤️</span><div class="bar-outer"><div class="bar-inner hp" id="hp-bar" style="width:100%"></div></div></div>
      <div class="stat-bar"><span>⚡</span><div class="bar-outer"><div class="bar-inner energy" id="energy-bar" style="width:100%"></div></div></div>
    </div>
  </div>
</div>

<div id="poi-marker" style="display:none;">
  <div class="poi-icon">◇</div>
  <div class="poi-label" id="poi-label">POI</div>
</div>

<div id="discovery-toast" class="toast">
  <div class="toast-title">🔍 גילוי חדש!</div>
  <div class="toast-text" id="toast-text"></div>
</div>
<div id="item-toast" class="toast item-toast">
  <div class="toast-title">✨ פריט נאסף!</div>
  <div class="toast-text" id="item-text"></div>
</div>

<div id="dpad">
  <div class="dpad-row"><button class="dpad-btn" data-key="forward">▲<span class="dpad-label">ישר</span></button></div>
  <div class="dpad-row">
    <button class="dpad-btn" data-key="left">◀<span class="dpad-label">שמאל</span></button>
    <button class="dpad-btn" data-key="right">▶<span class="dpad-label">ימין</span></button>
  </div>
  <div class="dpad-row"><button class="dpad-btn" data-key="backward">▼<span class="dpad-label">רוורס</span></button></div>
</div>

<button id="btn-interact" class="action-btn">🔍<br>חקור</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
