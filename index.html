<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>רובר מגלה - עולם פתוח</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="ui-container">
  <div id="top-left-hud">
    <button id="btn-fullscreen">🖥️ מסך מלא</button>
    <div id="stats">
      <div class="stat-bar"><span>❤️</span><div class="bar-outer"><div class="bar-inner" id="hp-bar"></div></div></div>
      <div class="stat-bar"><span></span><div class="bar-outer"><div class="bar-inner energy" id="energy-bar"></div></div></div>
      <div class="stat-bar"><span>🔋</span><div class="bar-outer"><div class="bar-inner battery" id="battery-bar"></div></div></div>
    </div>
    <div id="minimap">
      <canvas id="minimap-canvas" width="160" height="160"></canvas>
      <div id="minimap-rover"></div>
    </div>
    <div id="discovered-count">🔍 גילויים: <span id="disc-num">0</span> / <span id="disc-total">0</span></div>
  </div>
  <div id="top-right-hud">
    <div id="current-biome">🌿 שטח ירוק</div>
    <div id="time-display">🌞 12:00</div>
    <div id="quest-box">
      <div class="quest-title"> משימה</div>
      <div id="quest-text">חקור את העולם וגלה מקומות חדשים</div>
    </div>
  </div>
</div>

<div id="poi-marker" style="display:none;">
  <div class="poi-icon">◇</div>
  <div class="poi-label" id="poi-label">POI</div>
</div>

<div id="discovery-toast" class="toast">
  <div class="toast-title">🔍 גילוי חדש!</div>
  <div class="toast-text" id="toast-text"></div>
</div>
<div id="item-toast" class="toast item-toast">
  <div class="toast-title">✨ פריט נאסף!</div>
  <div class="toast-text" id="item-text"></div>
</div>

<div id="controls">
  <div id="ctrl-up">
    <button class="ctrl-btn" data-key="forward" title="ישר">▲<span class="ctrl-label">ישר</span></button>
  </div>
  <div id="ctrl-mid">
    <button class="ctrl-btn" data-key="left" title="שמאלה">◀<span class="ctrl-label">שמאלה</span></button>
    <button class="ctrl-btn" data-key="right" title="ימינה">▶<span class="ctrl-label">ימינה</span></button>
  </div>
  <div id="ctrl-down">
    <button class="ctrl-btn" data-key="backward" title="רוורס">▼<span class="ctrl-label">רוורס</span></button>
  </div>
</div>

<button id="btn-interact" class="interact-btn"><br>חקור</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
